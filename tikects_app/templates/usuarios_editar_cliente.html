{% extends 'base.html' %}
{% load static %}

{% block title %}Editar Cliente | Tickpro 3.0{% endblock %}

{% block content %}
<style>
    .glass-card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 20px;
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
    }
</style>

<div class="container-fluid animate__animated animate__fadeIn">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark"><i class="fas fa-user-edit me-2 text-primary"></i> Editar Cliente</h2>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="{% url 'soporte:dashboard' %}" class="text-decoration-none">Inicio</a></li>
                <li class="breadcrumb-item active text-primary fw-bold">Editar Cliente</li>
            </ol>
        </nav>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="glass-card p-4">
                <h5 class="fw-bold mb-4 text-center"><i class="fas fa-id-card me-2 text-primary"></i> Datos del usuario: {{ cliente.nombre|upper }}</h5>
                
                <form method="POST" class="needs-validation" novalidate>
                    {% csrf_token %}
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label small fw-bold">Nombre</label>
                            <input type="text" name="nombre" class="form-control rounded-pill" value="{{ cliente.nombre }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label small fw-bold">Apellido</label>
                            <input type="text" name="apellido" class="form-control rounded-pill" value="{{ cliente.apellido }}" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Nombre de usuario</label>
                        <input type="text" name="nombre_usuario" class="form-control rounded-pill" value="{{ cliente.nombre_usuario }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Correo Electrónico</label>
                        <input type="email" name="email" class="form-control rounded-pill" 
                               value="{{ cliente.email|default:'' }}" placeholder="ejemplo@correo.com">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Nueva contraseña (opcional)</label>
                        <input type="password" name="password" class="form-control rounded-pill" placeholder="Escribe para cambiar la clave">
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold">Gerencia</label>
                        <input type="text" name="gerencia" class="form-control rounded-pill" value="{{ cliente.gerencia }}" required>
                    </div>

                    <div class="d-flex justify-content-center gap-2">
                        <a href="{% url 'lista_clientes' %}" class="btn btn-outline-secondary rounded-pill px-5">Cancelar</a>
                        <button type="submit" class="btn btn-success rounded-pill px-5 shadow-sm">
                            <i class="fas fa-save me-2"></i> Guardar Cambios
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        'use strict';
        var forms = document.querySelectorAll('.needs-validation');
        Array.prototype.slice.call(forms).forEach(function(form) {
            form.addEventListener('submit', function(event) {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });
    })();
</script>
{% endblock %}
