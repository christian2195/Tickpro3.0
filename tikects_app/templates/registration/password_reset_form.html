{% extends 'base.html' %}
{% block title %}Recuperar Contraseña | Tickpro 3.0{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <!-- Aplicamos glass-card para mantener la estética 3.0 -->
    <div class="glass-card shadow-lg p-0" style="max-width: 450px; width: 100%; overflow: hidden;">
        <!-- Cabecera con tono profesional oscuro -->
        <div class="p-4 text-center" style="background-color: #1e293b; color: #f8fafc;">
            <h5 class="mb-0"><i class="fas fa-undo-alt me-2"></i>Recuperar Acceso</h5>
        </div>
        
        <div class="p-4">
            <p class="text-muted small mb-4">
                Introduce tu correo electrónico institucional. Te enviaremos un enlace seguro para restablecer tu clave.
            </p>
            
            <form method="post">
                {% csrf_token %}
                <div class="mb-4">
                    <label for="id_email" class="form-label small fw-bold text-dark">Correo Electrónico:</label>
                    <input type="email" name="email" id="id_email" class="form-control rounded-pill" 
                           placeholder="usuario@emvepro.gob.ve" required>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold shadow-sm">
                    <i class="fas fa-paper-plane me-2"></i>Enviar enlace de recuperación
                </button>
            </form>
            
            <div class="text-center mt-3">
                <a href="{% url 'inicio' %}" class="text-decoration-none small" style="color: #64748b;">
                    Volver al login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
