{% extends 'base.html' %}
{% block title %}Recuperar Contraseña{% endblock %}
{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card shadow-sm" style="max-width: 450px; width: 100%;">
        <div class="card-header bg-primary text-white text-center py-3">
            <h5 class="mb-0"><i class="fas fa-lock me-2"></i>¿Olvidaste tu contraseña?</h5>
        </div>
        <div class="card-body p-4">
            <p class="text-muted small">Introduce tu dirección de correo electrónico institucional y te enviaremos un enlace seguro para restablecerla.</p>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_email" class="form-label fw-bold">Correo Electrónico:</label>
                    <input type="email" name="email" id="id_email" class="form-control" placeholder="ejemplo@emvepro.gob.ve" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold">
                    <i class="fas fa-paper-plane me-2"></i>Enviar Enlace
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
