{% extends 'base.html' %}
{% block title %}Contraseña Restablecida | Tickpro 3.0{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="glass-card shadow-sm text-center p-5" style="max-width: 500px; width: 100%;">
        <div class="card-body">
            <div class="mb-4">
                <i class="fas fa-check-circle fa-4x text-success animate__animated animate__bounceIn"></i>
            </div>
            <h4 class="fw-bold text-dark mb-3">¡Contraseña Restablecida!</h4>
            <p class="text-muted small">Tu nueva clave ha sido guardada de forma segura.</p>
            <p class="text-muted small mb-4">Ya puedes ingresar a la plataforma con tus nuevas credenciales.</p>
            
            <a href="{% url 'inicio' %}" class="btn btn-primary rounded-pill px-5 shadow-sm fw-bold">
                <i class="fas fa-sign-in-alt me-1"></i> Iniciar Sesión
            </a>
        </div>
    </div>
</div>
{% endblock %}
