{% extends 'base.html' %}
{% load static %}

{% block title %}Crear Agente | Tickpro 3.0{% endblock %}

{% block content %}
<style>
    .glass-card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 20px;
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
    }
</style>

<div class="container-fluid animate__animated animate__fadeIn">
    <!-- Encabezado -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark"><i class="fas fa-user-plus me-2 text-primary"></i> Nuevo Agente</h2>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="{% url 'soporte:dashboard' %}" class="text-decoration-none">Inicio</a></li>
                <li class="breadcrumb-item active text-primary fw-bold">Crear Agente</li>
            </ol>
        </nav>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="glass-card p-4">
                <h5 class="fw-bold mb-4 text-center"><i class="fas fa-user-shield me-2 text-primary"></i> Información del Personal</h5>
                
                <form method="POST" class="needs-validation" novalidate>
                    {% csrf_token %}
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label small fw-bold">Nombre</label>
                            <input type="text" name="nombre" class="form-control rounded-pill" placeholder="Nombre" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label small fw-bold">Apellido</label>
                            <input type="text" name="apellido" class="form-control rounded-pill" placeholder="Apellido" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Nombre de Usuario</label>
                        <input type="text" name="nombre_usuario" class="form-control rounded-pill" placeholder="Ej: cgonzalez" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Correo Electrónico</label>
                        <input type="email" name="email" class="form-control rounded-pill" placeholder="usuario@emvepro.gob.ve" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Contraseña</label>
                        <input type="password" name="password" class="form-control rounded-pill" placeholder="••••••••" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold">Teléfono</label>
                        <input type="tel" name="telefono" class="form-control rounded-pill" placeholder="+58 000 0000000">
                    </div>

                    <div class="text-center pt-2">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill px-5 shadow-sm">
                            <i class="fas fa-check-circle me-2"></i> Registrar Agente
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
