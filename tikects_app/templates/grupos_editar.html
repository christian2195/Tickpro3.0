{% extends 'base.html' %}
{% load static %}

{% block title %}Editar Grupo | Tickpro 3.0{% endblock %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" rel="stylesheet" />

<style>
    .glass-card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 20px;
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
    }

    /* Adaptación de Select2 al Modo Oscuro */
    [data-bs-theme="dark"] .select2-container--bootstrap-5 .select2-selection,
    [data-bs-theme="dark"] .select2-container--bootstrap-5 .select2-dropdown,
    [data-bs-theme="dark"] .select2-container--bootstrap-5 .select2-search__field {
        background-color: #1e293b !important;
        border-color: rgba(255, 255, 255, 0.1) !important;
        color: #f8fafc !important;
    }
    [data-bs-theme="dark"] .select2-results__option { color: #f8fafc !important; }
    [data-bs-theme="dark"] .select2-results__option--highlighted { background-color: #0d6efd !important; }
</style>

<div class="container-fluid animate__animated animate__fadeIn">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark"><i class="fas fa-users-cog me-2 text-primary"></i> Editar Grupo</h2>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="{% url 'configuracion' %}" class="text-decoration-none">Configuración</a></li>
                <li class="breadcrumb-item"><a href="{% url 'usuarios_grupos_agentes' %}" class="text-decoration-none">Grupos</a></li>
                <li class="breadcrumb-item active text-primary fw-bold">Editar</li>
            </ol>
        </nav>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card-modern p-4">
                <h5 class="fw-bold mb-4"><i class="fas fa-layer-group me-2 text-primary"></i> Modificar datos y agentes</h5>
                
                <form method="post" class="needs-validation" novalidate>
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Nombre del Grupo <span class="text-danger">*</span></label>
                        <input type="text" name="nombre" class="form-control rounded-pill" value="{{ grupo.nombre }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Descripción <span class="text-danger">*</span></label>
                        <textarea name="descripcion" class="form-control rounded-3" rows="3" required>{{ grupo.descripcion }}</textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold">Asignar Agentes</label>
                        <select class="form-select select2-agentes" name="agentes" multiple="multiple" style="width: 100%;">
                            {% for agente in todos_los_agentes %}
                                <option value="{{ agente.id }}" {% if agente.id in agentes_del_grupo %}selected{% endif %}>
                                    {{ agente.nombre_usuario }} - {{ agente.correo }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'usuarios_grupos_agentes' %}" class="btn btn-outline-secondary rounded-pill px-4">Cancelar</a>
                        <button type="submit" class="btn btn-primary rounded-pill px-4 shadow-sm">
                            <i class="fas fa-save me-2"></i> Guardar Cambios
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script>
    $(document).ready(function() {
        $('.select2-agentes').select2({ 
            theme: 'bootstrap-5', 
            placeholder: "Selecciona agentes...",
            allowClear: true 
        });
    });
</script>
{% endblock %}
