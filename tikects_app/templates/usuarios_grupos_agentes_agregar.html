{% extends 'base.html' %}

{% block content %}
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-0">
                    <div class="card-header bg-success text-white text-center py-3">
                        <h4 class="mb-0"><i class="fas fa-user-plus me-2"></i> Asignar Agente a Grupo</h4>
                    </div>
                    <div class="card-body p-4">
                        {% if error %}
                            <div class="alert alert-danger shadow-sm">{{ error }}</div>
                        {% endif %}

                        <form method="post">
                            {% csrf_token %}
                            
                            <div class="mb-3">
                                <label for="agente" class="form-label fw-bold">Seleccionar Agente</label>
                                <select class="form-select" id="agente" name="agente" required>
                                    <option value="" disabled selected>-- Elija un agente --</option>
                                    {% for agente in agentes %}
                                        <option value="{{ agente.id }}">
                                            {{ agente.nombre_usuario }} - {{ agente.usuario.first_name }} {{ agente.usuario.last_name }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="mb-4">
                                <label for="grupo" class="form-label fw-bold">Seleccionar Grupo</label>
                                <select class="form-select" id="grupo" name="grupo" required>
                                    <option value="" disabled selected>-- Elija un grupo --</option>
                                    {% for grupo in grupos %}
                                        <option value="{{ grupo.id }}">{{ grupo.nombre }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success btn-lg">
                                    <i class="fas fa-save me-2"></i> Confirmar Asignación
                                </button>
                                <a href="{% url 'usuarios_por_grupos_agentes' %}" class="btn btn-outline-secondary">
                                    <i class="fas fa-arrow-left me-2"></i> Cancelar
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
